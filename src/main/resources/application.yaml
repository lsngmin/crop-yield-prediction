spring:
  application:
    name: crop-yield-api

server:
  port: 8080

app:
  model:
    onnx-path: models/crop_yield_rf.onnx
    metadata-path: models/feature_order.json
    version: v1.0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never